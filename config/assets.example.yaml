# ════════════════════════════════════════════════════════════════════
#  这个文件是模板，会被提交进 git。
#
#  真正要改的是 config/assets.yaml —— 先复制一份：
#
#      cp config/assets.example.yaml config/assets.yaml
#
#  config/assets.yaml 被 .gitignore 排除了，因为里面是你的真实资产数据。
#
#  这个文件**只放资产项和负债项**。标题、副标题、数据截止日期、
#  页脚备注这些固定信息在 config/site.ts 里。
# ════════════════════════════════════════════════════════════════════
#
# ── 三条规矩 ──────────────────────────────────────────────────────
#
# 1. 金额写正数，单位是元。房贷写 980000，不要写 -980000 ——
#    正负由它放在 assets 还是 liabilities 下面决定。
#
# 2. 金额不要带千分位逗号、下划线、引号或 ¥ 符号，直接写 1600000。
#    YAML 会把 1,600,000 和 1_600_000 当成**字符串**而不是数字，
#    构建时会报错拦下来（这是刻意的，免得数字悄悄变成 NaN）。
#
# 3. 同一侧里名字不能重复。
#
# ── 其他 ──────────────────────────────────────────────────────────
#
# · 顺序随便写，页面会按金额从大到小自己排。
# · note 是可选的，显示在名字下面，写口径用的。
# · assets 不能为空；liabilities 可以一条都没有（那就是无负债）。
# · 值里如果含半角冒号或 # ，要用引号包起来。
# · 字段名拼错会被构建期校验拒绝，不会静默变成 undefined。

