name: 构建 Windows 安装包

# 手动触发，或推 tag（如 v0.1.0）时构建。
# 不挂在每次 push 上：Rust 构建要跑好几分钟，一个个人项目没必要每次提交都烧额度。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: 装 pnpm
        uses: pnpm/action-setup@v4

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Rust 工具链 + 缓存。缓存是关键：没有它每次都要重编整个依赖树，
      # 首次约 5~10 分钟，命中缓存后一两分钟。
      - name: 装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 依赖
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 装前端依赖
        run: pnpm install --frozen-lockfile

      # pnpm desktop:build 就是 tauri build，它会先跑 beforeBuildCommand
      # （scripts/build-desktop.mjs：next build 出 out/，再删掉其中的 ledger.json），
      # 然后 cargo build 把前端资源嵌进 exe。
      # 仓库里没有 config/assets.yaml（被 gitignore），所以构建机本来就碰不到你的数据，
      # 删副本那一步是给本地构建也兜一层底。
      - name: 构建安装包
        run: pnpm desktop:build

      - name: 收集产物
        uses: actions/upload-artifact@v4
        with:
          name: 个人资产看板-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
