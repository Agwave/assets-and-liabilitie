name: 构建 Windows 安装包

# 手动触发，或推 tag（如 v0.1.0）时构建。
# 不挂在每次 push 上：Rust 构建要跑好几分钟，一个个人项目没必要每次提交都烧额度。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    # 发 Release 需要写权限。默认的 GITHUB_TOKEN 是只读的，不显式提权的话
    # 最后那步会以 403 失败，而且报错信息不太直观。
    permissions:
      contents: write

    # 下面几个 action 的版本是**最早支持 Node.js 24 的那个**，不是最新的。
    # GitHub 已经不给 Node 20 的 action 供货了，会打印弃用警告；
    # 但直接跳到最新大版本会跨好几个版本，中间可能有本机验不了的行为变化
    # （比如 setup-node v7 是一次 ESM 迁移）。最小升级最稳。
    # 判断依据是各 action 的 action.yml 里 `runs.using`：
    #   checkout      v5+ → node24
    #   setup-node    v5+ → node24
    #   action-setup  v5+ → node24
    #   upload-artifact v6+ → node24
    # 要动这些版本号前，先按上面这条标准确认一遍。
    steps:
      - uses: actions/checkout@v5

      - name: 装 pnpm
        uses: pnpm/action-setup@v5

      - name: 装 Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # Rust 工具链 + 缓存。缓存是关键：没有它每次都要重编整个依赖树，
      # 首次约 5~10 分钟，命中缓存后一两分钟。
      # dtolnay/rust-toolchain 是复合型 action，不跑 Node，不受弃用影响。
      - name: 装 Rust
        uses: dtolnay/rust-toolchain@stable

      # rust-cache@v2 已经是 node24，不用动
      - name: 缓存 Rust 依赖
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 装前端依赖
        run: pnpm install --frozen-lockfile

      # pnpm desktop:build 就是 tauri build，它会先跑 beforeBuildCommand
      # （scripts/build-desktop.mjs：next build 出 out/，再删掉其中的 ledger.json），
      # 然后 cargo build 把前端资源嵌进 exe。
      # 仓库里没有 config/assets.yaml（被 gitignore），所以构建机本来就碰不到你的数据，
      # 删副本那一步是给本地构建也兜一层底。
      - name: 构建安装包
        run: pnpm desktop:build

      # 手动跑（workflow_dispatch）时产物挂在这次运行下面，保留 90 天
      - name: 收集产物
        uses: actions/upload-artifact@v6
        with:
          name: 个人资产看板-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe

      # 推 tag 时（如 v0.1.0）额外发一个 Release，安装包永久挂在上面：
      #   https://github.com/<owner>/<repo>/releases
      #
      # 用 tag 而不是每次提交都发版 —— Release 页是给人看的「版本列表」，
      # 每次提交都往里塞会让它变成一团乱麻。
      #
      # softprops/action-gh-release 要用 v3+：v2 跑在 Node 20 上，GitHub 已经
      # 不再提供那个运行时，会打弃用警告。
      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: src-tauri/target/release/bundle/nsis/*.exe
